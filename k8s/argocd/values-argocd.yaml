server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: true
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/backend-protocol: HTTPS
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:564008997955:certificate/dd42f6cc-811e-4f3e-a395-68f4d57edf9c
      alb.ingress.kubernetes.io/ssl-redirect: "443"
    ingressClassName: alb
    hostname: argocd.wesleydutra.online

controller:
  replicas: 1

repoServer:
  replicas: 1

applicationSet:
  replicaCount: 1

redis-ha:
  enabled: false

configs:
  cm:
    timeout.reconciliation: 5s
